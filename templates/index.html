<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sirah MapTap</title>

  <!-- Leaflet: the map library. CSS first, then JS at the bottom. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">

  <!-- url_for lets Flask build the right path to files in /static -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- The map fills the whole screen; everything else floats above it. -->
  <div id="map" aria-label="Satellite map of the Hijaz"></div>

  <!-- Prompt panel (top left) -->
  <section id="panel" class="panel">
    <h1 class="title">Sirah MapTap</h1>
    <p class="round" id="round-label">Round 1 of 3</p>
    <p class="prompt-lead">Where is</p>
    <h2 class="prompt" id="prompt">loading…</h2>
    <p class="hint" id="hint">Tap the map to place your guess.</p>
    <button id="confirm" class="confirm" disabled>Confirm guess</button>
  </section>

  <!-- Reveal drawer (right side), hidden until all 3 guesses are in -->
  <aside id="reveal" class="reveal" hidden>
    <header class="reveal-head">
      <button id="back-to-map" class="back-btn" type="button">Back to map</button>
      <p class="reveal-day" id="reveal-day"></p>
      <p class="reveal-score"><span id="daily-score">0</span><span class="of">/100</span></p>
      <p class="reveal-sub">Average of three rounds</p>
      <p class="legend">
        <span class="legend-key pin-answer"></span> Correct location
        <span class="legend-key pin-guess"></span> Your guess
      </p>
    </header>
    <div id="results"></div>
    <footer class="reveal-foot">
      <p>Come back tomorrow for three new locations.</p>
      <button id="dev-reset" class="ghost" type="button">Play today's round again</button>
    </footer>
  </aside>

  <!-- Phone-only summary bar shown over the map after the reveal -->
  <div id="mobile-bar" class="mobile-bar" hidden>
    <span class="mobile-bar-score"><strong id="mobile-score">0</strong>/100</span>
    <span class="mobile-bar-hint">Tap a location to read about it</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Turf.js: geometry helpers. We use it for point-in-polygon (is this
       coordinate inside this province shape?) rather than hand-matching
       province names ourselves. -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>

</html>
